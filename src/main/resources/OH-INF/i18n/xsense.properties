# channel types

channel-type.xsense.co-alarm.label = CO Alarm
channel-type.xsense.co-alarm.description = Indicates whether the detector reports a carbon monoxide alarm.
channel-type.xsense.co-level.label = CO Concentration
channel-type.xsense.co-level.description = Current carbon monoxide concentration.
channel-type.xsense.co-peak.label = CO Peak Concentration
channel-type.xsense.co-peak.description = Highest carbon monoxide concentration recorded by the detector.
channel-type.xsense.combo-alarm.label = Alarm
channel-type.xsense.combo-alarm.description = Indicates whether the detector reports a smoke or carbon monoxide alarm.
channel-type.xsense.door-contact.label = Contact
channel-type.xsense.door-contact.description = Indicates whether the door or window is open.
channel-type.xsense.heat-alarm.label = Heat Alarm
channel-type.xsense.heat-alarm.description = Indicates whether the detector reports a heat alarm.
channel-type.xsense.motion.label = Motion
channel-type.xsense.motion.description = Indicates whether the sensor detects motion.
channel-type.xsense.signal.label = Signal Strength
channel-type.xsense.signal.description = RF signal strength between sensor and base station (0-3).
channel-type.xsense.smoke-alarm.label = Smoke Alarm
channel-type.xsense.smoke-alarm.description = Indicates whether the detector reports a smoke alarm.
channel-type.xsense.water-alarm.label = Water Leak Alarm
channel-type.xsense.water-alarm.description = Indicates whether the detector reports a water leak.

# thing status descriptions

offline.communication-error = Communication with the X-Sense cloud failed: {0}
offline.communication-error-session = The cloud session expired and could not be renewed: {0}
offline.config-error-credentials = Email address and password must be configured
offline.config-error-device-sn = The serial number of the sensor must be configured
offline.config-error-house-id = The house id of the home must be configured
offline.config-error-login = Login to the X-Sense cloud failed, check email address and password: {0}
offline.config-error-station-sn = The serial number of the base station must be configured
offline.device-not-found = The sensor is no longer attached to the base station
offline.home-not-found = The home is no longer registered in the X-Sense account
offline.sensor-offline = The sensor reports that it is not connected to the base station
offline.station-not-found = The base station is no longer registered in the X-Sense account
offline.station-offline = The base station is not connected to the X-Sense cloud
